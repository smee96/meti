<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METI 프로젝트 견적서 다운로드</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #0A2260 0%, #1A3D2E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #0A2260;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .file-info {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .file-name {
            font-weight: bold;
            color: #0A2260;
            margin-bottom: 10px;
        }
        .file-size {
            color: #666;
            font-size: 14px;
        }
        .download-btn {
            background: #0A2260;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }
        .download-btn:hover {
            background: #1A3368;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(10, 34, 96, 0.3);
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📄</div>
        <h1>METI 프로젝트 견적서</h1>
        <p class="subtitle">SI 견적 작성용 문서</p>
        
        <div class="file-info">
            <div class="file-name">PROJECT_ESTIMATE.md</div>
            <div class="file-size">파일 크기: 40 KB</div>
        </div>
        
        <a href="/static/PROJECT_ESTIMATE.md" download="METI_PROJECT_ESTIMATE.md" class="download-btn">
            📥 다운로드
        </a>
    </div>
</body>
</html>
